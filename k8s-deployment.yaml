apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-project
  template:
    metadata:
      labels:
        app: final-project
    spec:
      containers:
      - name: final-project
        image: issverg/final-project:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: final-project
spec:
  type: NodePort
  selector:
    app: final-project
  ports:
  - port: 3000
    targetPort: 3000
